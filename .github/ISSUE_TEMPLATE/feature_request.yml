name: Feature request
description: Propose a focused improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or operator problem should be solved?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Describe the behavior and alternatives considered.
    validations:
      required: true
  - type: textarea
    id: risk
    attributes:
      label: Security and accounting impact
      description: Explain any effect on funds, trust, privacy, randomness, or operations.
    validations:
      required: true
